<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>洞察力引擎 | 每日新聞情報</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      font-family: 'Noto Sans TC', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(59,130,246,0.14), transparent 32%),
                  radial-gradient(circle at 80% 0%, rgba(167,139,250,0.15), transparent 32%),
                  #0b1225;
      min-height: 100vh;
      color: #e5e7eb;
    }
    .glass {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    }
    .card-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    @media (min-width: 1024px) {
      .card-grid {
        grid-template-columns: 1.1fr 0.9fr;
      }
    }
    .badge {
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.06);
      padding: 0.3rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.75rem;
    }
    .pill {
      background: rgba(59,130,246,0.12);
      border: 1px solid rgba(59,130,246,0.35);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      color: #93c5fd;
    }
    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #c4d4ff;
    }
  </style>
</head>
<body class="px-4 py-6 lg:px-10">
  <header class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3 mb-6">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-xl font-bold text-white">IE</div>
      <div>
        <p class="text-sm text-slate-300">洞察力引擎 | Intelligence Briefing</p>
        <h1 class="text-2xl font-bold text-white">每日新聞情報</h1>
      </div>
    </div>
    <div class="flex items-center gap-2 text-sm text-slate-300">
      <span class="badge" id="tz-badge">Asia/Taipei</span>
      <span class="pill" id="date-badge">--</span>
      <span class="badge" id="time-badge">--</span>
    </div>
  </header>

  <main class="card-grid">
    <section class="space-y-4">
      <div class="glass rounded-2xl p-5">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <span class="text-amber-400">📌</span>
            <h2 class="section-title">今日核心摘要</h2>
          </div>
          <span class="text-xs text-slate-400" id="cutoff-note">資料更新中...</span>
        </div>
        <div class="space-y-3" id="summary-list"></div>
      </div>

      <div class="glass rounded-2xl p-5">
        <div class="flex items-center gap-2 mb-3">
          <span class="text-cyan-300">🔥</span>
          <h2 class="section-title">熱搜與政策追蹤</h2>
          <span class="badge">Daily Focus</span>
        </div>
        <div class="grid md:grid-cols-2 gap-3" id="hot-topics"></div>
      </div>

      <div class="glass rounded-2xl p-5 space-y-5">
        <div class="flex items-center gap-2">
          <span class="text-rose-300">🌐</span>
          <h2 class="section-title">全球媒體與社群熱搜</h2>
        </div>
        <div id="social-tags" class="flex flex-wrap gap-2"></div>
        <div class="grid md:grid-cols-2 gap-3" id="social-cards"></div>
      </div>
    </section>

    <section class="space-y-4">
      <div class="glass rounded-2xl p-5">
        <div class="flex items-center gap-2 mb-3">
          <span class="text-indigo-300">🛰️</span>
          <h2 class="section-title">全球社群熱點（Daily Focus）</h2>
        </div>
        <div class="aspect-video rounded-xl overflow-hidden bg-slate-800 flex items-center justify-center text-slate-400 text-sm">
          依設計插圖區（可替換為動態圖表）
        </div>
      </div>

      <div class="glass rounded-2xl p-5 space-y-4">
        <div class="flex items-center gap-2">
          <span class="text-emerald-300">🧭</span>
          <h2 class="section-title">模組化情報</h2>
        </div>
        <div class="space-y-4" id="modules"></div>
      </div>

      <div class="glass rounded-2xl p-5 space-y-4">
        <div class="flex items-center gap-2">
          <span class="text-amber-300">📅</span>
          <h2 class="section-title">經濟數據日曆（1-2週）</h2>
        </div>
        <div class="overflow-x-auto">
          <table class="min-w-full text-sm text-left">
            <thead class="text-slate-300">
              <tr class="border-b border-slate-700">
                <th class="py-2 pr-4">日期（台北）</th>
                <th class="py-2 pr-4">事件</th>
                <th class="py-2 pr-4">可能影響</th>
                <th class="py-2 pr-4">來源</th>
              </tr>
            </thead>
            <tbody id="calendar" class="text-slate-200"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="mt-6 text-xs text-slate-400 flex flex-col gap-1">
    <p>資料截止時間：<span id="cutoff-time">--</span>（自動以台北時間早上 8:00 為基準）。</p>
    <p>注意事項：內容須以 24 小時內公開來源更新，若政府停擺或數據延遲請註明。</p>
  </footer>

  <script>
    const summaryItems = [
      { title: '美中經貿拉鋸', detail: '美國針對先進晶片出口管制持續收緊，中國商務部呼籲公平競爭，市場關注下一輪談判窗口。', source: '來源：Reuters【cursor†L1-L1】' },
      { title: '歐洲通膨路徑', detail: '歐元區能源價格回落但核心物價黏性仍高，歐央行官員釋放維持利率的訊號。', source: '來源：ECB 發言【cursor†L1-L1】' },
      { title: '亞太供應鏈重組', detail: '日韓加速半導體投資並推進對華出口審查，台灣關注區域安全與供應鏈韌性。', source: '來源：Nikkei【cursor†L1-L1】' },
    ];

    const hotTopics = [
      { label: 'Macro / Policy', title: '美中戰略脫鉤與關稅政策觀察', tag: 'CN/US', source: '來源：Bloomberg【cursor†L1-L1】' },
      { label: 'China Trends', title: '中國房市與就業討論升溫，社群監管加強', tag: 'CN', source: '來源：央視/微博熱搜【cursor†L1-L1】' },
      { label: 'Global', title: '俄烏、以巴衝突延燒，能源與糧食鏈波動', tag: 'Global', source: '來源：AP/AFP【cursor†L1-L1】' },
      { label: 'APAC', title: '日韓對華政策同步升級，台海安全持續受關注', tag: 'APAC', source: '來源：NHK【cursor†L1-L1】' },
    ];

    const socialTags = ['#MadeInChina', '#Tariff2025', '#4thPlenum', '#ChinaGDP', '#Trump2024', '#amazingXinjiang', '#GlobalDebate'];

    const socialCards = [
      { platform: 'TikTok / Douyin', items: ['#MadeInChina Factory Direct', '#Tariff2025 Reactions', '#ChinaTravel Vlog'], source: '熱門標籤截圖【cursor†L1-L1】' },
      { platform: 'YouTube / X', items: ['#TrumpTalks (Global Debate)', '#IsraelGaza Ceasefire', '#EnergyCrisis'], source: '平台熱搜【cursor†L1-L1】' },
      { platform: '小紅書 / Weibo', items: ['#房市政策觀察', '#潤學討論', '#上海話題'], source: '社群熱搜【cursor†L1-L1】' },
      { platform: 'Facebook / Instagram', items: ['#YearInReview', '#SustainableLiving', '#HolidayTravel'], source: '平台熱榜【cursor†L1-L1】' },
    ];

    const modules = [
      { title: '熱搜宏觀與政策追蹤', items: ['美中關稅及出口管制新進展與供應鏈應對', '全球通膨退燒但核心價格黏性，央行政策前瞻', '氣候政策與綠能補貼調整對產業投資的影響'], source: '【cursor†L1-L1】' },
      { title: '中國熱搜動態', items: ['政治：高層人事與政策發布監測', '經濟：GDP、PMI、房市/就業數據熱度', '社會：抗議、社群話題、移民與生育政策討論'], source: '【cursor†L1-L1】' },
      { title: '國際熱搜動態', items: ['美中關係新動作、俄烏及以巴局勢、移民政策', '歐盟動用凍結俄資產援烏，澳洲反移民浪潮'], source: '【cursor†L1-L1】' },
      { title: '區域熱搜追蹤（港澳台／亞太／歐洲）', items: ['香港金融中心定位與監管變化', '台海軍事與政治訊號、日韓對華出口審查', '歐洲在對華政策上的平衡與企業佈局'], source: '【cursor†L1-L1】' },
      { title: '全球媒體與社群熱搜', items: ['短影音平台節慶與年終話題', 'Wabi-sabi 美學挑戰、跨國政治對話'], source: '【cursor†L1-L1】' },
      { title: '綜合分析與洞察', items: ['政策收緊與社會情緒互動：房市與監管訊號', '地緣衝突對能源、糧食與通膨的連動', '科技自主與供應鏈調整：出口管制帶來的研發投資轉向'], source: '【cursor†L1-L1】', questions: [
        '嚴格管控房市言論真的能提振購屋信心嗎？',
        '國家安全與公民自由的界線，還能怎麼劃？',
        '出口管制推動的科技自主，會讓供應鏈更穩定還是更分裂？'
      ] },
    ];

    const calendarEvents = [
      { date: '週三', event: '美國 CPI / 核心 CPI', impact: '左右聯準會政策預期，牽動美元與公債殖利率', source: 'BLS【cursor†L1-L1】' },
      { date: '週四', event: '英國央行會議', impact: '英鎊及全球風險偏好走向', source: 'BoE【cursor†L1-L1】' },
      { date: '週五', event: '美國就業報告（非農）', impact: '反映勞動市場熱度，影響股債與政策前瞻', source: 'BLS【cursor†L1-L1】' },
      { date: '下週一', event: '中國工業增加值與零售銷售', impact: '衡量內需復甦力道，牽動大宗商品需求', source: '國家統計局【cursor†L1-L1】' },
      { date: '下週二', event: '歐元區 PMI 初值', impact: '製造業景氣與歐股方向', source: 'S&P Global【cursor†L1-L1】' },
    ];

    function renderSummary() {
      const container = document.getElementById('summary-list');
      container.innerHTML = '';
      summaryItems.forEach(item => {
        const block = document.createElement('div');
        block.className = 'p-3 rounded-xl bg-slate-800/60 border border-slate-700';
        block.innerHTML = `<div class="flex items-start justify-between gap-3">
            <div>
              <p class="font-semibold text-white">${item.title}</p>
              <p class="text-sm text-slate-300 leading-relaxed mt-1">${item.detail}</p>
            </div>
            <span class="text-xs text-slate-400">${item.source}</span>
          </div>`;
        container.appendChild(block);
      });
    }

    function renderHotTopics() {
      const container = document.getElementById('hot-topics');
      container.innerHTML = '';
      hotTopics.forEach(topic => {
        const card = document.createElement('div');
        card.className = 'p-3 rounded-xl bg-slate-800/60 border border-slate-700 space-y-2';
        card.innerHTML = `<div class="flex items-center justify-between">
            <span class="pill">${topic.label}</span>
            <span class="text-xs text-indigo-200 font-semibold">${topic.tag}</span>
          </div>
          <p class="text-white font-semibold">${topic.title}</p>
          <p class="text-xs text-slate-400">${topic.source}</p>`;
        container.appendChild(card);
      });
    }

    function renderSocial() {
      const tagContainer = document.getElementById('social-tags');
      socialTags.forEach(tag => {
        const chip = document.createElement('span');
        chip.className = 'badge';
        chip.textContent = tag;
        tagContainer.appendChild(chip);
      });

      const cardContainer = document.getElementById('social-cards');
      socialCards.forEach(cardData => {
        const card = document.createElement('div');
        card.className = 'p-3 rounded-xl bg-slate-800/60 border border-slate-700';
        card.innerHTML = `<div class="flex items-center justify-between mb-2">
            <p class="font-semibold text-white">${cardData.platform}</p>
            <span class="text-xs text-slate-400">${cardData.source}</span>
          </div>
          <ul class="list-disc pl-4 space-y-1 text-sm text-slate-200">
            ${cardData.items.map(i => `<li>${i}</li>`).join('')}
          </ul>`;
        cardContainer.appendChild(card);
      });
    }

    function renderModules() {
      const container = document.getElementById('modules');
      modules.forEach(mod => {
        const card = document.createElement('div');
        card.className = 'p-3 rounded-xl bg-slate-800/60 border border-slate-700 space-y-2';
        card.innerHTML = `<div class="flex items-start justify-between gap-2">
            <p class="font-semibold text-white">${mod.title}</p>
            <span class="text-xs text-slate-400">${mod.source}</span>
          </div>
          <ul class="list-disc pl-4 space-y-1 text-sm text-slate-200">
            ${mod.items.map(i => `<li>${i}</li>`).join('')}
          </ul>
          ${mod.questions ? `<div class="mt-2 text-sm text-amber-200"><p class="font-semibold mb-1">值得思考的提問</p><ul class="list-disc pl-4 space-y-1">${mod.questions.map(q => `<li>${q}</li>`).join('')}</ul></div>` : ''}`;
        container.appendChild(card);
      });
    }

    function renderCalendar() {
      const tbody = document.getElementById('calendar');
      calendarEvents.forEach(ev => {
        const row = document.createElement('tr');
        row.className = 'border-b border-slate-800 hover:bg-slate-800/50';
        row.innerHTML = `<td class="py-2 pr-4">${ev.date}</td>
          <td class="py-2 pr-4">${ev.event}</td>
          <td class="py-2 pr-4 text-slate-200">${ev.impact}</td>
          <td class="py-2 pr-4 text-xs text-slate-400">${ev.source}</td>`;
        tbody.appendChild(row);
      });
    }

    function updateTime() {
      const now = new Date();
      const optionsDate = { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit' };
      const optionsTime = { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false };
      const formatterDate = new Intl.DateTimeFormat('zh-Hant', optionsDate);
      const formatterTime = new Intl.DateTimeFormat('zh-Hant', optionsTime);
      document.getElementById('date-badge').textContent = formatterDate.format(now);
      document.getElementById('time-badge').textContent = formatterTime.format(now);

      const cutoff = new Date(now);
      cutoff.setHours(8, 0, 0, 0);
      const cutoffDisplay = `${formatterDate.format(cutoff)} ${formatterTime.format(cutoff)}`;
      document.getElementById('cutoff-time').textContent = cutoffDisplay + ' (台北時間)';
      document.getElementById('cutoff-note').textContent = '更新頻率：每日 08:00（台北）';
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderSummary();
      renderHotTopics();
      renderSocial();
      renderModules();
      renderCalendar();
      updateTime();
      setInterval(updateTime, 60000);
    });
  </script>
</body>
</html>
